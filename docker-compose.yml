services:
  app:
      build:
        context: .
        dockerfile: app.dockerfile
      image: app
      ports:
        - "${APP_PORT}:${APP_PORT}"
      environment:
        APP_PORT: ${APP_PORT}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
      depends_on:
        redis:
          condition: service_healthy
      restart: unless-stopped


  redis:
    image: redis:7.4-alpine
    volumes:
      - redisData:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redisData:
